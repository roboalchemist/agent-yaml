# Example 41: vtcode CLI agent
# Tests: cli-agent: vtcode with headless exec
# Requires:
#   - [automation.full_auto] in the workspace vtcode.toml
#   - a custom provider in the platform vtcode.toml (see docs/ADAPTER_TROUBLESHOOTING.md)
#   - the provider's API key exported (BIFROST_VK_MASTER for the block below)

directory: /tmp

cli-agent: vtcode
cli-agent-config:
  provider: bifrost
  model: chunglet/deepseek-v4.1-flash
  skip-confirmations: true
  timeout: 600

template-variables:
  output-dir: "{{directory}}/agent-yaml-test-41"

task:
  - setup:
      prompt: |
        Create {{output-dir}} and write {{output-dir}}/setup.log with:
        "vtcode adapter test
        User: {{user}}
        Timestamp: {{datetime}}"
      validate:
        - file-exists: "{{output-dir}}/setup.log"
