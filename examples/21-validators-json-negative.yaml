# Example 21: JSON Validator - Negative Test
# Demonstrates json-valid validator failure with invalid JSON
#
# This is a NEGATIVE test - validation should FAIL (as designed)

directory: /tmp

cli-agent: opencode
cli-agent-config:
  skip-confirmations: true
  timeout: 120

on-error: continue  # Continue workflow even when validation fails

template-variables:
  output-dir: "{{directory}}/validator-test-21-{{datetime}}"
  json-file: "{{output-dir}}/invalid.json"

task:
  - create-directory:
      prompt: |
        Create directory {{output-dir}} if it doesn't exist:
        mkdir -p {{output-dir}}

  - generate-invalid-json:
      prompt: |
        Create file {{json-file}} with INVALID JSON (missing quotes, trailing comma):

        {
          "workflow": "example-21",
          timestamp: "{{datetime}}",
          "status": "success",
          "data": {
            "items": ["a", "b", "c",],
          },
        }

        This JSON is intentionally broken to test the json-valid validator.
        Use echo or cat to write this exact text to the file.

      validate:
        - file-exists: "{{json-file}}"
        - file-not-empty: "{{json-file}}"
        - json-valid: "{{json-file}}"

      on-error: continue  # Task-level override
      retry:
        max-attempts: 1
        on-validation-failure: retry  # Will exhaust and fall back to error_strategy

  - verify-failure-detected:
      prompt: |
        The previous task should have failed JSON validation.

        Verify that:
        1. File {{json-file}} exists
        2. File has content (not empty)
        3. File does NOT contain valid JSON
        4. json-valid validator failed

        Then print: "✅ Test passed - json-valid validator correctly detected invalid JSON"
