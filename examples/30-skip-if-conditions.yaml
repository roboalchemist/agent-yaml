# Skip-If Conditions Example
# Demonstrates file-based skip conditions for idempotent workflows.
#
# Skip conditions check BEFORE task execution:
# - file-exists: Skip if the specified file exists
# - file-contains: Skip if file contains specific text
#
# This enables idempotent workflows where tasks are skipped if
# they have already been completed (indicated by flag files or status markers).
#
# Fresh run: all five tasks run and the workflow exits 0. Run it again in the same
# directory and generate-report, deploy and validate are skipped (their markers
# exist); setup and cleanup run every time.

directory: /tmp

cli-agent: opencode

cli-agent-config:
  skip-confirmations: true
  timeout: 300

template-variables:
  output-dir: "{{directory}}/agent-yaml-test-30-skip"
  flag-file: "{{output-dir}}/deployed.flag"
  status-file: "{{output-dir}}/status.txt"

task:
  # Task 1: Setup - Creates the output directory and the status file
  # This task will always run since we need the directory. file-contains needs its
  # file to exist, so the status file starts as PENDING; an existing status file is
  # left alone so that a re-run still sees VALIDATED.
  - setup:
      prompt: |
        Create the directory {{output-dir}} if it doesn't exist.

        If {{status-file}} does not exist, create it containing exactly the single
        word PENDING (no quotes). If it already exists, leave it unchanged.

        Do not create any other files (no report.md and no flag files yet).

  # Task 2: Generate Report
  # Skip if report already exists
  - generate-report:
      prompt: |
        Create the file {{output-dir}}/report.md with exactly this content:

        # Status Report

        ## Summary

        Report generated by the skip-if example.
      skip-if:
        file-exists: "{{output-dir}}/report.md"

  # Task 3: Deploy Application (simulated)
  # Skip if deploy flag file exists
  - deploy:
      prompt: |
        Simulate a deployment: write the single word deployed (no quotes) to
        {{flag-file}}. Do not create or change any other files.
      skip-if:
        file-exists: "{{flag-file}}"

  # Task 4: Run Validation (simulated)
  # Skip if status file contains "VALIDATED"
  # on-error: skip only matters under --dry-run: setup does not execute there, so the
  # status file is missing, the file-contains check errors, and the task is skipped
  # instead of failing the dry run. On a real run setup has created the file.
  - validate:
      prompt: |
        Simulate validation: overwrite {{status-file}} so that it contains exactly the
        single word VALIDATED (no quotes). Do not create or change any other files.
      skip-if:
        file-contains:
          path: "{{status-file}}"
          text: "VALIDATED"
      on-error: skip

  # Task 5: Final Cleanup
  # Always runs (no skip condition)
  - cleanup:
      prompt: |
        Write the text "cleanup complete" (no quotes) to {{output-dir}}/cleanup.txt.
        Do not delete or change any other files.
