# Gather > rfc_research.md >
# RFC Syle guide:

# Consider:
# - If this is a feature-addition RFC, or a re-architecturing RFC (or both!)

# # DO:
# - Keep it broken down by change category, as you would when breaking the project down into individual PRs, so each one can be interpreted individually
# - default to a paragrah style of documentation instead of everything being bullet-point lists
# - Have example json call/response code blocks if there are api changes made, to specify what the api calls should look like
# - include sql language on database changes,
# - include technical details on a per-code-change basis, not on an overall basis

# # DONT
# - write full database migration scripts
# - include python code blocks
# - mention specific files/lines
# - include more than one example
# - Mention specific/potential product use cases unless absolutely required to make sense of the change

# Questions to ask:
# Which endpoints needs to be updated for this to happen?
# Which data models need to be updated for this to work?
# Look at public-api for any changes that might be needed
# Consider how the database model migration will work. What will happen with existing endpoints? What happens when applicatiosn that use the existing endpoint structure still provide the old style of information. Do we have resasonable defaults? What about items that consume the new database elements, do we have reasonable defaults for when there's a None/null returned?
# How do the existing frontend elements get their information?  Are the existing endpoints sufficient for the frontend requirements proposed?

