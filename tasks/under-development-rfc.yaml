rfc-first-pass:
  - setup:
      desc: "create the needed folder"
  - gather:
      desc: "gather PRD, notion, in-code docs"
  - research:
      desc: "research questions"
  - copy-template:
      desc: "copy over the rfc template docs"
  - write-background-section:
      desc: "write out the non-technical background elemets from the PRD document"
  - write-requirements-section:
      desc: "write out the project requirements section from the PRD document"
  - break-out:
      desc: "break out into the technical changes needed by change-category into frontned/firmware/backend"
  - populate-each-section:
      desc: "for each technical change needed, populate out the section"
  - add-section-appendix:
      desc: "Add appendix"
  - add-section-open-questions:
      desc: "open questions we haven't answered yet"
  - add-section-considerations:
      desc: "we need human considerations to investigate"
  - add-section-milestones:
      desc: "populate the milestones for the project"
  - populate-testing-plan:
      desc: "populate the testing plan for each section"
  - break-project-into-tickets:
      desc: "pre-stage the linear tickets"

