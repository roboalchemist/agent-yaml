        1. Count PRs processed from {{prs_csv}}
        2. Read {{ambiguities_file}} for accumulated ambiguities

        Write to {{workspace}}/summary.md:

        # Docstring PR Review Summary
        Completed: {{datetime}}
        Mode: Discovery

        ## PRs Reviewed
        [list each PR from the CSV]

        ## Accumulated Ambiguities
        [summary from {{ambiguities_file}}]

        ## Next Steps
        - Review: {{ambiguities_file}}
        - Consider updating the docstring standard
        - Verify all PRs pushed successfully
        {% endif %}

        Print the summary to confirm completion.

      validate:
        - file-exists: "{{workspace}}/summary.md"
        - file-not-empty: "{{workspace}}/summary.md"
