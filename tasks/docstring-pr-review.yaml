  # Phase 2f: Single PR mode - STEP 5c: Post PR comment
  - post-pr-comment:
      cli-agent-config:
        timeout: 60  # 1 minute - simple gh command
      prompt: |
        {% if pr_number and pr_branch %}
        # CRITICAL: Only post if council review actually completed
        if [ ! -f "{{temp_dir}}/pr-{{pr_number}}-review.md" ]; then
          echo "SKIP: Council review file not found - review did not complete"
          echo "NOT posting comment to PR #{{pr_number}}"
          exit 0
        fi

        # Check if review file contains actual review (not just error/skip message)
        if grep -q "No Review Needed - No Changes" {{temp_dir}}/pr-{{pr_number}}-review.md; then
          echo "SKIP: No changes in branch - not posting comment"
          exit 0
        fi

        # Check if outcome file exists and indicates review completed
        if [ ! -f "{{temp_dir}}/pr-{{pr_number}}-outcome.txt" ]; then
          echo "SKIP: Outcome file not found - review may have failed"
          echo "NOT posting comment to PR #{{pr_number}}"
          exit 0
        fi

        LOG: "POST START: $(date -Iseconds) - PR #{{pr_number}}: Posting comment to GitHub"

        Post the crafted comment to PR #{{pr_number}}.

        1. Verify the comment file exists:
           ls -lh {{temp_dir}}/pr-{{pr_number}}-comment.md

        2. Post the comment to GitHub:
           gh pr comment {{pr_number}} --body-file {{temp_dir}}/pr-{{pr_number}}-comment.md

        3. Confirm it was posted:
           echo "✅ Comment posted successfully to PR #{{pr_number}}"
           echo "View at: https://github.com/example-org/example-repo/pull/{{pr_number}}"

        That's all. Just post the comment.

        LOG: "POST COMPLETE: $(date -Iseconds) - Comment posted to GitHub"
        {% else %}
        echo "Skipping post-pr-comment - using discovery mode"
        {% endif %}

  # Phase 2g: Discovery mode (skips if pr_number is set)
  - discover-prs:
      prompt: |
        {% if pr_number %}
        # SKIP: Using single PR mode instead
        echo "Skipping discovery - single PR mode active"
        {% else %}
        # DISCOVERY MODE: Search GitHub for open PRs that need docstring review

        SEARCH CRITERIA:
        - Repository: example-org/example-repo
        - State: open
        - Title contains: "Update docstrings for"
        - Author: {{github_user}}
        - Auto-merge is NOT enabled

        STEPS:
        1. Search for matching PRs and filter to those WITHOUT auto-merge enabled:

           gh pr list --repo example-org/example-repo --author "{{github_user}}" --state open --search "Update docstrings in:title" --json number,title,headRefName,url,autoMergeRequest --limit 50 | jq '[.[] | select(.autoMergeRequest == null)]'

        2. Write results to CSV file {{prs_csv}} with columns: number,title,branch,url

           Use jq to transform:
           ... | jq -r '["number","title","branch","url"], (.[] | [.number, .title, .headRefName, .url]) | @csv' > {{prs_csv}}

        3. Report how many PRs were found.

        If no PRs match, create an empty CSV with just the header row.
        {% endif %}

  # CSV Loop: Process PRs in parallel using git worktrees
  # In single PR mode, CSV is empty so loop has 0 iterations (effectively skipped)
  - review-and-fix-loop:
      loop:
        type: csv
        source: "{{prs_csv}}"
        skip-header: true
        columns: [number, title, branch, url]
        workers: 3  # Process 3 PRs in parallel
        git-worktrees:
          enabled: true
          base: "{{directory}}/.docstring-review-worktrees"
          branch-field: "branch"
          name-template: "pr-{{loop.item.number}}"
          cleanup: true
      prompt: |
        PR #{{loop.item.number}}: {{loop.item.title}}
        URL: {{loop.item.url}}
        Branch: {{loop.item.branch}}
        Worker: {{loop.worker.id}}
        Worktree: {{loop.worker.directory}}
        Progress: {{loop.index}}/{{loop.total}}

        LOG: "PHASE START: $(date -Iseconds) - Worker {{loop.worker.id}} starting review for PR #{{loop.item.number}}"

        NOTE: Working in git worktree at {{loop.worker.directory}}
        Branch {{loop.item.branch}} is already checked out.

        IMPORTANT: We do NOT merge master to avoid polluting old PR branches
        with hundreds of commits. Reviewing the PR as-is.

        === COUNCIL REVIEW ===

        LOG: "COUNCIL START: $(date -Iseconds) - Running council review"

        Get the PR diff using local git (no API calls):
        git diff origin/master...HEAD

        Run /ask-council with the following prompt:
        ---
        PR: {{loop.item.url}}

        Here is a PR that makes some docstring updates. Below is the git diff showing
        the changes. Examine the docstring updates/additions and validate that all
        updated/added docstrings conform to the docstring standard found in
        {{docstring_standard}}. Validate that the contents of the docstring(s)
        updated/added in this PR are accurate. If there are any deviations, report
        back on them. Also report back any docstring ambiguities that caused issues
        in the council. The proposed fixes should be a simple numbered list, with
        how many agreed.

        DIFF:
        [Include the output from: git diff origin/master...HEAD]

        DOCSTRING STANDARD:
        [Include the contents of {{docstring_standard}}]
        ---

        Save the council's response to: {{temp_dir}}/pr-{{loop.item.number}}-review.md

        LOG: "COUNCIL COMPLETE: $(date -Iseconds) - Council review saved"

        === STEP 3: IMPLEMENT FIXES ===

        LOG: "FIXES START: $(date -Iseconds) - Implementing council-recommended fixes"

        CRITICAL: Do NOT ask for user confirmation before implementing fixes.
        Implement all council-recommended fixes immediately and automatically.

        Based on the council review:

        1. If NO issues were found, skip to STEP 4.

        2. If issues were found:
           a. IMMEDIATELY implement EACH fix from the council's "Proposed Fixes" list
              - Do NOT ask for confirmation
              - Do NOT skip or delay implementation
              - Make the exact changes prescribed by the council
           b. ONLY modify docstrings, do NOT change any code logic
           c. After implementing ALL fixes:
              LOG: "AUTOFIX START: $(date -Iseconds) - Running autofix"
              - Run: just autofix
              LOG: "COMMIT START: $(date -Iseconds) - Committing and pushing fixes"

              # Stage only service directory changes
              - git add example-service/ service-a/ public-api/ --update

              # Verify exactly 1 file changed
              CHANGED_FILES=$(git diff --cached --name-only | wc -l | tr -d ' ')
              if [ "$CHANGED_FILES" != "1" ]; then
                echo "ERROR: Expected exactly 1 file changed, found $CHANGED_FILES files:"
                git diff --cached --name-only
                exit 1
              fi

              # Verify only docstrings changed (no code logic changes)
              if git diff --cached | grep -E '^\+[^+]' | grep -vE '("""|Args:|Returns:|Raises:|Permissions:|Notes:|Json:|Summary:|    )' | grep -v '^+++' | grep -q .; then
                echo "WARNING: Detected potential code changes (not just docstrings):"
                git diff --cached | grep -E '^\+[^+]' | grep -vE '("""|Args:|Returns:|Raises:|Permissions:|Notes:|Json:|Summary:|    )' | grep -v '^+++'
                echo "Aborting commit - review changes manually"
                exit 1
              fi

              git status --short  # Show what will be committed
              - git commit -m "Fix docstring issues from council review"
              - git push origin {{loop.item.branch}}
              LOG: "FIXES COMPLETE: $(date -Iseconds) - All fixes pushed to GitHub"

        === VERIFICATION: Ensure docstring-only changes ===

        # Verify only docstrings were modified (independent of council feedback)
        LAST_COMMIT=$(git rev-parse HEAD)
        CHANGED_FILES=$(git diff HEAD~1 --name-only | wc -l | tr -d ' ')

        if [ "$CHANGED_FILES" != "1" ]; then
          echo "ERROR: Found $CHANGED_FILES files changed (expected 1)"
          echo "REVERTING commit to prevent multi-file pollution"
          git reset --hard HEAD~1
          git push --force origin {{loop.item.branch}}
          exit 1
        fi

        # Check for code changes outside docstrings
        if git diff HEAD~1 | grep -E '^\+[^+]' | grep -vE '("""|Args:|Returns:|Raises:|Permissions:|Notes:|Json:|Summary:|    |^\+$)' | grep -v '^+++' | grep -q .; then
          echo "ERROR: Code changes detected (not just docstrings)"
          echo "REVERTING commit to prevent code logic changes"
          git reset --hard HEAD~1
          git push --force origin {{loop.item.branch}}
          exit 1
        fi

        echo "✓ Verification passed: Only docstrings in 1 file"

           d. Return to master: git checkout master

        IMPORTANT: This is an automated workflow. Implement fixes without asking permission.

        === STEP 4: LOG AMBIGUITIES ===

        LOG: "LOGGING START: $(date -Iseconds) - Recording ambiguities"

        Append to {{ambiguities_file}}:
        ```
        ## PR #{{loop.item.number}} - {{loop.item.title}}
        Reviewed: {{datetime}}

        [List any ambiguities, or "No ambiguities found"]

        ---
        ```

        LOG: "PHASE COMPLETE: $(date -Iseconds) - Finished review for PR #{{loop.item.number}}"

  # Phase 3: Summary (always runs)
  - summary:
      prompt: |
        Create a summary of the docstring review workflow.

        {% if pr_number %}
        # Single PR Mode Summary
        Write to {{workspace}}/summary.md:

        # Docstring PR Review Summary
        Completed: {{datetime}}
        Mode: Single PR

        ## PR Reviewed
        - PR #{{pr_number}}: {{pr_branch}}
          URL: https://github.com/example-org/example-repo/pull/{{pr_number}}

        ## Ambiguities
        Check {{ambiguities_file}} for any logged ambiguities.
        {% else %}
