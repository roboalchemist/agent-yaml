[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-yaml"
version = "0.1.0"
description = "Declarative YAML workflows for AI coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Joe Schlesinger"}
]
keywords = ["ai", "agents", "orchestration", "workflow", "yaml", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "backports.zoneinfo>=0.2.1; python_version<'3.9'",
]

[project.urls]
Homepage = "https://github.com/roboalchemist/agent-yaml"
Repository = "https://github.com/roboalchemist/agent-yaml"
Issues = "https://github.com/roboalchemist/agent-yaml/issues"
Changelog = "https://github.com/roboalchemist/agent-yaml/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.6",
    "httpx>=0.27",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7,<10",
]

[project.scripts]
agent-yaml = "agent_yaml.cli:main"

# The package lives at the repo root (not a src/ layout), so list it explicitly.
[tool.setuptools.packages.find]
where = ["."]
include = ["agent_yaml", "agent_yaml.*"]

[tool.setuptools.package-data]
"agent_yaml.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "live: real OpenCode agent + real model (tests/live); skipped unless --live is given",
]

[tool.coverage.run]
source = ["agent_yaml"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# The documented baseline is "F/E9 must be clean"; style rules stay advisory.
select = ["F", "E9"]
ignore = ["E203"]
